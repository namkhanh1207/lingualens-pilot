name: Pilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: python3 tests/migration-phase1.py
      - run: npm run build
      - run: npm run db:migrate
        env:
          TURSO_DATABASE_URL: file:ci-pilot.db
      - name: Integration suites against localhost only
        shell: bash
        run: |
          AUTH_MODE=local-test ADMIN_EMAILS=test-admin@sites.test TURSO_DATABASE_URL=file:ci-pilot.db npm run dev -- --hostname 127.0.0.1 --port 8787 > worker-test.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS 'http://127.0.0.1:8787/api/pilot?view=readings' > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat worker-test.log; exit 1; fi
          for suite in pilot phase1 phase2 phase4 completion review; do
            node "tests/$suite.integration.mjs"
          done
      - name: Real login tests against production build
        shell: bash
        env:
          TURSO_DATABASE_URL: file:ci-auth.db
          ADMIN_EMAILS: test-admin@sites.test
          AUTH_MODE: local-test
          APP_ORIGIN: http://127.0.0.1:5182
        run: |
          npm run db:migrate
          npm run start -- --hostname 127.0.0.1 --port 5182 > auth-test.log 2>&1 &
          auth_pid=$!
          trap 'kill "$auth_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:5182/login' > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat auth-test.log; exit 1; fi
          node tests/pilot-auth.integration.mjs
